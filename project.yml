# The source of truth for `Artscribe.app`. The generated `Artscribe.xcodeproj`
# is disposable and gitignored — regenerate it with `xcodegen generate`, or just
# run `make app`, which does that and everything after it.
#
# Why an Xcode project at all, when every module builds under SwiftPM: a
# `.app` bundle is an Xcode product. SwiftPM builds bare executables, and an
# executable is not double-clickable, has no Info.plist, declares no document
# types and cannot be signed as an application. So the bundle is the *only*
# thing this project builds — the code comes from the SwiftPM package below.
#
# `swift build`, `swift test` and `swift run` are untouched by any of this and
# remain the development path. See README ▸ Running Artscribe.
name: Artscribe

options:
  bundleIdPrefix: com.artscribe
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# The package is this repository. Xcode can only depend on package *products*,
# which is why `Package.swift` exports `ArtscribeUI` as a library.
packages:
  Artscribe:
    path: .

settings:
  base:
    # Apple Silicon only, as the README says. Xcode's default is a universal
    # binary, and Homebrew ships arm64-only libraries, so the x86_64 slice fails
    # to link rubberband. Nothing here has ever been an Intel product.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is taken from the environment so that turning on a real Developer
    # ID needs no edit to a tracked file — `make app` exports these, defaulting
    # to ad-hoc. See README ▸ Signing for the four things to set once you have
    # an Apple Developer account.
    #
    # Ad-hoc ("-") is enough for the machine that built it and for anyone
    # willing to right-click ▸ Open once. It is not enough for a download.
    CODE_SIGN_IDENTITY: "$(ARTSCRIBE_SIGN_IDENTITY)"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "$(ARTSCRIBE_TEAM_ID)"
    # Notarisation requires the hardened runtime, and the hardened runtime
    # requires the library-validation exception already in the entitlements
    # file before it will load the embedded Homebrew dylibs.
    ENABLE_HARDENED_RUNTIME: "$(ARTSCRIBE_HARDENED_RUNTIME)"
    DEAD_CODE_STRIPPING: YES

targets:
  Artscribe:
    type: application
    platform: macOS
    # Just the `App` scene. Everything else arrives as the ArtscribeUI product,
    # so there is one copy of the code and SwiftPM and Xcode compile the same
    # files.
    sources:
      - path: Sources/ArtscribeApp
      # Generated by the pre-build script below; gitignored. Listed here so it
      # lands in Contents/Resources, which is where CFBundleIconFile looks.
      - path: App/Artscribe.icns
        optional: true
    dependencies:
      - package: Artscribe
        product: ArtscribeUI
    # Deliberately *not* XcodeGen's `info:` / `entitlements:` keys. Those
    # generate the files from this manifest and overwrite whatever is on disk —
    # which silently threw away the document-type declarations the first time.
    # The plists are hand-written sources; the build settings below just point
    # at them.
    settings:
      base:
        PRODUCT_NAME: Artscribe
        PRODUCT_BUNDLE_IDENTIFIER: com.artscribe.Artscribe
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Artscribe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        # Homebrew's pkg-config data for rubberband. SwiftPM finds it from the
        # environment; xcodebuild needs telling.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - /opt/homebrew/include
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - /opt/homebrew/lib
    preBuildScripts:
      - name: Icon
        script: |
          "$SRCROOT/App/generate-icon.sh"
        outputFiles:
          - $(SRCROOT)/App/Artscribe.icns
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Makes the bundle stand on its own: copies the two Homebrew dylibs it
      # links into Contents/Frameworks, repoints the load commands at them, and
      # drops the licences in Resources. Without this the app only runs on a Mac
      # with Homebrew's rubberband installed in the same prefix.
      - name: Embed dependencies and licences
        script: |
          "$SRCROOT/App/embed-dependencies.sh"
        basedOnDependencyAnalysis: false

  # The iPad build. Deliberately minimal: it is the `App` scene only, and takes
  # everything else from the same `ArtscribeUI` product the Mac app does, so
  # there is one copy of the application and both platforms compile the same
  # files.
  #
  # No `preBuildScripts` and no `postBuildScripts`: the icon generator draws an
  # `.icns`, which is a macOS format, and `embed-dependencies.sh` exists to carry
  # Homebrew's Rubber Band dylibs — which do not exist for iOS, and are the
  # reason this build cannot yet change playback speed.
  ArtscribeiPad:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    dependencies:
      - package: Artscribe
        product: ArtscribeUI
    settings:
      base:
        PRODUCT_NAME: Artscribe
        PRODUCT_BUNDLE_IDENTIFIER: com.artscribe.Artscribe
        INFOPLIST_FILE: App/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        # Automatic signing, unlike the Mac target's manual Developer ID: this
        # build is installed on your own iPad for testing, and automatic signing
        # is what mints and renews the development profile for it. There is no
        # notarisation step on iOS for this to interfere with.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "$(ARTSCRIBE_TEAM_ID)"
        # No Homebrew search paths, and that is the point — if this target ever
        # needs them, something macOS-only has crept below `ArtscribeUI`.

schemes:
  Artscribe:
    build:
      targets:
        Artscribe: all
    run:
      config: Debug
    archive:
      config: Release

  ArtscribeiPad:
    build:
      targets:
        ArtscribeiPad: all
    run:
      config: Debug
