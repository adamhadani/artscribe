# Run `make bootstrap` then `pre-commit install` after cloning.
# These hooks mirror `make check` so CI never tells you something your
# commit could have told you first.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored third-party source is excluded from all three whitespace
      # hooks. `Sources/CSignalsmithStretch/vendor/` must stay byte-identical to
      # upstream: `git diff` against a freshly downloaded release is how that
      # library gets reviewed when it is updated, and a hook that silently
      # retabbed 3000 lines would bury the real change completely. See its
      # VENDOR.md.
      - id: trailing-whitespace
        exclude: '(\.(flac|wav|mp3|m4a|ogg|opus)$|^Sources/CSignalsmithStretch/vendor/)'
      - id: end-of-file-fixer
        exclude: '(\.(flac|wav|mp3|m4a|ogg|opus)$|^Sources/CSignalsmithStretch/vendor/)'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^Sources/CSignalsmithStretch/vendor/'
      # Enforces the project rule that test fixtures stay small. Real audio
      # (the reference album) must never be committed — it lives behind
      # $ARTSCRIBE_TEST_MEDIA_DIR instead.
      # Excludes exactly one path, and no wildcard: the bundled sample track.
      # A demo track is the App Store's guideline 2.1 answer — a reviewer opens
      # the app with no audio on the device and must still have something to
      # play — so it has to ship inside the binary, and 100 KB does not buy a
      # listenable excerpt of anything. The exclusion names the single file
      # rather than the directory, so a second one cannot arrive unnoticed.
      - id: check-added-large-files
        args: [--maxkb=100]
        exclude: ^Sources/ArtscribeUI/Resources/GoldbergVariatio4\.m4a$
      # A key pasted into a source file is not caught by .gitignore, which only
      # knows about filenames. This reads content, and it is the hook that would
      # notice a Developer ID private key or an App Store Connect .p8 inlined
      # into a script "temporarily".
      - id: detect-private-key

  # swift-format ships inside the Swift 6.3 toolchain — do NOT brew install it.
  # swiftlint comes from `make bootstrap`.
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (lint)
        entry: swift format lint --strict
        language: system
        types: [swift]

      - id: swiftlint
        name: swiftlint (strict)
        entry: swiftlint lint --quiet --strict
        language: system
        types: [swift]
        pass_filenames: false

  # Broad secret scanning, for everything `detect-private-key` does not model:
  # cloud credentials, personal access tokens, and high-entropy strings. Run on
  # every commit rather than only in CI, because the point is to stop a secret
  # entering history at all — once it is in a public repo's history it must be
  # treated as compromised and rotated, not merely removed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
