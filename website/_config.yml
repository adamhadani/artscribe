title: Artscripture
tagline: A keyboard-first music transcription tool for macOS and iPadOS
description: >-
  Artscripture is a keyboard-first music transcription tool for macOS and iPadOS.
  Load a track, select a passage, loop it seamlessly, and slow it down without
  changing pitch.

url: https://adamhadani.github.io
baseurl: /artscripture

# Every outbound link the site uses, in one place. Nothing here is fetched at
# build time or at page load — see /privacy/, which the site has to be able to
# tell the truth about.
repo_url: https://github.com/adamhadani/artscripture
download_url: https://github.com/adamhadani/artscripture/releases/latest
releases_url: https://github.com/adamhadani/artscripture/releases
issues_url: https://github.com/adamhadani/artscripture/issues
new_issue_url: https://github.com/adamhadani/artscripture/issues/new
license_url: https://github.com/adamhadani/artscripture/blob/main/LICENSE

# No theme gem. `minima` is a blog theme and this is not a blog; the layout in
# `_layouts/` and the single stylesheet in `assets/css/` are the whole design.
theme: null
plugins: []

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  style: compressed
  # Nothing is served from a source map on a static marketing site, and an
  # unreferenced .map file in the deploy is just noise.
  sourcemap: never

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - README.md
