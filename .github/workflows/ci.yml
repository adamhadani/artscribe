name: CI

on:
  push:
    branches: [main]
    # Documentation cannot break the build, and a macOS runner bills at **10x**
    # the Linux rate — a README-only commit costing ten minutes of quota buys
    # nothing. Anything that can affect the build is absent from this list, so
    # the default is still "run".
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  # **No `paths-ignore` on pull_request, deliberately.** `build-and-test` is a
  # *required* status check on main, and a required check that never runs is
  # never reported — so a documentation-only PR sits at "Expected — waiting for
  # status" and can never merge. Observed on PR #2, which was MERGEABLE and
  # BLOCKED with zero checks. The saving is not worth a class of PR that cannot
  # land, and on a public repository the runners are free anyway.
  pull_request:

# One run per branch. Pushing three commits in a minute used to start three full
# macOS runs and pay for all of them; now the older two are cancelled the moment
# they are superseded, because only the newest commit's result is worth knowing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 is GA on arm64 and is the only image with a Swift 6.3 /
    # macOS 26 SDK toolchain. macos-15 cannot build platforms: [.macOS(.v26)].
    runs-on: macos-26
    # A hung test used to sit on a runner until the six-hour ceiling. The suite
    # takes ~3 s locally and a cold CI build a few minutes, so 25 is generous
    # and still fails fast enough to be useful.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version && swift format --version && sw_vers

      - name: Install dependencies
        run: brew install rubberband swiftlint

      # The build directory is the expensive part of a cold run: every
      # dependency and every module compiled from scratch. Keyed on the manifest
      # and the sources, so it is reused whenever neither changed and rebuilt
      # when they do.
      - name: Cache the SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Lint
        run: swiftlint lint --quiet --strict

      - name: Test
        # `--no-parallel`, deliberately. Swift Testing runs concurrently, and
        # every `@MainActor` test serialises on the main actor — so one test
        # that blocks it leaves several hundred others "started" and never
        # finished, which is what a hung run looks like and tells you nothing
        # about which test is at fault. Serial execution names the culprit: it
        # is simply the last one to start.
        run: swift test --no-parallel

  # The audio stack — ArtscribeKit, AudioDecode, Waveform, TimeStretch, Playback —
  # is portable; ArtscribeUI and above are AppKit and are not. A macOS build
  # notices neither an AppKit import that has crept downward nor an AVAudioSession
  # call left outside its `#if`, so portability is *compiled*, against the real iOS
  # SDK, rather than asserted.
  #
  # Its own job rather than a step in the one above: it needs no Homebrew and no
  # test run, so it starts immediately and reports independently — a portability
  # break should not read as "the tests failed".
  ios-build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # No `brew install rubberband`, and that is the point. Homebrew builds a
      # macOS dylib only, so `CRubberBand` is a macOS-conditional dependency and
      # `RubberBandStretcher` is behind `#if canImport(CRubberBand)`. If this job
      # ever needs Rubber Band installed to pass, the conditional has been
      # breached.
      - name: Build the audio stack for iOS
        run: |
          xcodebuild build -scheme Playback \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios -quiet

      # The UI layer as well, as of the iPad port. Separate step rather than
      # replacing the one above: `Playback` building for iOS is the stronger
      # guarantee (it is the part that must stay portable forever), and if the UI
      # step is the one that breaks the log should say so directly.
      - name: Build the UI layer for iOS
        run: |
          xcodebuild build -scheme ArtscribeUI \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios -quiet

  # Compiling for iOS proves the code *builds* there. This proves it **behaves**
  # there, which is a different and stronger claim: 144 tests — the viewport
  # maths, selection and loop regions, the cue parser, pitch, the peak pyramid —
  # run on a real iPad simulator.
  #
  # Only the two portable suites. `ArtscribeUITests` needs AppKit and
  # `PlaybackTests` needs the CoreAudio HAL and Rubber Band, so both are macOS
  # facts by construction and belong in `build-and-test` above.
  #
  # `AudioDecodeTests` is deliberately **not** here: Ogg Vorbis decodes on macOS
  # and fails on iOS with `.unreadable("Operation Stopped")`, so the shared
  # format expectation has to become platform-aware before that suite can run on
  # both. Adding it with the case removed would hide a real product difference.
  ios-simulator-tests:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Pinned to a device family rather than a specific OS point release: the
      # runner image decides which simulator runtimes exist, and naming one that
      # a later image drops would fail for a reason that has nothing to do with
      # the code.
      - name: Run the portable suites on an iPad simulator
        run: |
          for scheme in ArtscribeKitTests WaveformTests; do
            xcodebuild test -scheme "$scheme" \
              -destination 'platform=iOS Simulator,name=iPad (A16)' \
              -derivedDataPath .build/xcode-sim -quiet
          done
