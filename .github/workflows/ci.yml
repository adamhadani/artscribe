name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install rubberband swiftlint

      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Lint
        run: swiftlint lint --quiet --strict

      - name: Test
        run: swift test
